name: Build RevFUR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller tkinterdnd2

      - name: Validate Python and tests
        run: |
          python -m py_compile main.py revfur_core.py furparser.py
          python -m unittest discover -s tests -v

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RevFUR --collect-all tkinterdnd2 main.py

      - name: Build Linux application
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name RevFUR --collect-all tkinterdnd2 main.py
          mkdir -p dist
          tar -czf dist/RevFUR-linux-x86_64.tar.gz -C dist RevFUR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          ./build_deb.sh

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name RevFUR --collect-all tkinterdnd2 main.py
          ditto -c -k --keepParent dist/RevFUR.app dist/RevFUR-${{ runner.arch }}.zip

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RevFUR-windows-x64
          path: dist/RevFUR.exe
          if-no-files-found: error

      - name: Upload Linux builds
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RevFUR-linux-x86_64
          path: |
            dist/RevFUR-linux-x86_64.tar.gz
            dist/revfur_0.1.5_all.deb
          if-no-files-found: error

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RevFUR-macos-${{ runner.arch }}
          path: dist/RevFUR-*.zip
          if-no-files-found: error
